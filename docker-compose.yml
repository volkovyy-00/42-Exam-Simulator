# C Exam Gym on the Pi 4 (1.8 GiB RAM). DESIGN.md §0, §2 and §10; steps in DEPLOY.md.
#   docker compose --profile build build   # also builds the grader:pinned sandbox image
#   docker compose up -d
# Host prerequisites (DEPLOY.md): cgroup_enable=memory, patched kernel, /srv/grader/jobs exists,
# `sudo tailscale serve --bg --https=8443 http://127.0.0.1:8042`.
# Memory worst case (DESIGN.md §0 row 8): 1 sandbox × 256m + web 320m + dispatcher 256m = 832 MiB.
name: c-exam-gym

services:
  web:
    build: { context: ., dockerfile: api/Dockerfile }
    restart: unless-stopped
    env_file: [ { path: .env, required: false } ]
    environment:
      DATA_DIR: /data
      CONTENT_DIR: /content
      DISPATCHER_URL: http://grader-dispatcher:9000
    ports:
      - "127.0.0.1:8042:8042"        # Tailscale serve only; never 0.0.0.0
    volumes:
      - ./data:/data
      - ./content:/content:ro
    networks: [internal, egress]      # egress: OpenRouter for hints
    mem_limit: 320m
    depends_on: [grader-dispatcher]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8042/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    # No docker.sock here, ever.

  grader-dispatcher:
    build: { context: ., dockerfile: grader/dispatcher/Dockerfile }
    restart: unless-stopped
    # No env_file: this service holds docker.sock, so it gets only its own vars (DESIGN.md §9).
    # Values come from .env via interpolation; OPENROUTER_API_KEY / SESSION_SECRET never reach it.
    environment:
      COMPILE_TIMEOUT_S: ${COMPILE_TIMEOUT_S:-10}
      TEST_TIMEOUT_S: ${TEST_TIMEOUT_S:-2}
      TEST_CPU_S: ${TEST_CPU_S:-1}
      SUBMISSION_TIMEOUT_S: ${SUBMISSION_TIMEOUT_S:-30}
      GRADER_CONCURRENCY: ${GRADER_CONCURRENCY:-1}   # Pi 4: one 256m sandbox at a time
      GRADER_QUEUE_MAX: ${GRADER_QUEUE_MAX:-20}
      GRADER_IMAGE: ${GRADER_IMAGE:-grader:pinned}
      JOBS_DIR: /srv/grader/jobs      # fixed: must match the mount below
      CONTENT_DIR: /content           # fixed: must match the mount below
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./content:/content:ro
      - /srv/grader/jobs:/srv/grader/jobs   # same path as on the host: the daemon resolves bind paths there
    networks: [internal]              # no published ports, no internet
    mem_limit: 256m                   # 192m sat at the cap from page cache on the Pi 4
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Sandbox image only: built, never started by compose, never pulled at grade time.
  grader-image:
    build: { context: grader/image }
    image: grader:pinned
    profiles: [build]
    network_mode: none
    entrypoint: ["true"]

networks:
  internal:
    internal: true
  egress: {}
